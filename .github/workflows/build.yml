name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (MinGW + CMake)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-glm
            mingw-w64-x86_64-openal

      - name: Pin ImGui to v1.91.8
        shell: pwsh
        run: |
          if (-not (Test-Path imgui)) {
            git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git imgui
          }

      - name: Build with CMake & Ninja
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run Headless QA Verification
        shell: msys2 {0}
        run: |
          ./build/SolarOdyssey.exe --qa-capture

      - name: Upload executable & screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SolarOdyssey-windows
          path: |
            build/SolarOdyssey.exe
            build/shaders/
            build/Textures/
            build/Sound/
            Screenshots/
